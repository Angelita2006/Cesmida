services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cesmida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-houseStore}
    volumes:
      - cesmida_postgres:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cesmida} -d ${POSTGRES_DB:-houseStore}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [cesmida]

  api:
    build: ./backend
    restart: unless-stopped
    # Expo's development web server runs on 8081 and calls the API directly.
    # Publish the API so web, Android emulator, and LAN devices can reach it.
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cesmida}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-houseStore}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:8081,http://127.0.0.1:8081}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [cesmida]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [cesmida]

volumes:
  cesmida_postgres:

networks:
  cesmida:
    driver: bridge
